# Codemagic CI/CD — builds the AuthentiScan Pro iOS app in the cloud (no Mac needed).
#
# ── ONE-TIME SETUP IN THE CODEMAGIC UI (https://codemagic.io) ─────────────────
# 1. Sign up and connect this GitHub repository (authentiscanapp/app_v1).
# 2. Settings → Integrations → Developer Portal: add an App Store Connect API key.
#    - In App Store Connect (appstoreconnect.apple.com) → Users and Access → Integrations
#      → App Store Connect API → generate a key (role: App Manager). Download the .p8,
#      note the Key ID and Issuer ID. Paste all three into Codemagic.
#    - Name the key exactly "AuthentiScan App Store Connect" (used below),
#      or rename it below to match.
# 3. Register the App ID com.authentiscan.pro at developer.apple.com → Identifiers.
# 4. In App Store Connect, register the app once with bundle id: com.authentiscan.pro
#    (Apps → + → New App). This must exist before the first TestFlight upload.
#
# Code signing is fully automatic: the CLI creates the distribution certificate and
# the provisioning profile on the first run and reuses them afterwards.
# ─────────────────────────────────────────────────────────────────────────────
workflows:
  ios-release:
    name: AuthentiScan Pro — iOS
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: AuthentiScan App Store Connect
    environment:
      groups:
        - appstore_credentials
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.authentiscan.pro"
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install npm dependencies
        script: npm ci
      - name: Build the web app (React → build/)
        script: npm run build
      - name: Sync web build + plugins into the iOS project
        script: npx cap sync ios
      - name: Set the build number (auto-incrementing)
        script: |
          cd ios/App
          agvtool new-version -all "$BUILD_NUMBER"
      - name: Set up code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build the signed .ipa
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # Upload every successful build to TestFlight for beta testing.
        submit_to_testflight: true
        # To also submit for App Store review automatically, uncomment:
        # submit_to_app_store: false
      email:
        recipients:
          - ivanmorato@gmail.com
        notify:
          success: true
          failure: true
